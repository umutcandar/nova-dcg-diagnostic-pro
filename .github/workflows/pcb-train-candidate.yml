name: Train experimental PCB detector candidate (CC-BY dataset)
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Experimental CPU training epochs (do not promote without independent QA)"
        type: number
        default: 30
        required: true
      imgsz:
        description: "Image size; multiple of 32"
        type: number
        default: 640
        required: true
  push:
    paths:
      - 'pcb_train_candidate.py'
      - 'test_pcb_train_candidate.py'
      - '.github/workflows/pcb-train-candidate.yml'
jobs:
  train-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      YOLO_CONFIG_DIR: /tmp/nova-yolo-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.5.1+cpu" "torchvision==0.20.1+cpu"
      - name: Install YOLO trainer and ONNX export (not installed on Render)
        run: |
          python -m pip install "ultralytics>=8.3,<9" "onnx>=1.17,<2" \
            "onnxruntime>=1.19,<2" "PyYAML>=6,<7" "Pillow>=10,<13"
      - name: Unit-test training data audit with synthetic images
        run: python -m unittest -v test_pcb_train_candidate
      - name: Get pinned public dataset (only train/val; no media committed to NOVA)
        run: |
          git clone --quiet --filter=blob:none --sparse --depth 1 \
            https://github.com/wangshnegqi/pcb-component-detection-dataset-yolo.git /tmp/nova-train-data
          git -C /tmp/nova-train-data sparse-checkout set \
            dataset/images/train dataset/images/val dataset/labels/train dataset/labels/val
          test "$(git -C /tmp/nova-train-data rev-parse HEAD)" = "0d7ae7310fa607389779b6132285336ad73e96e1"
          grep -q 'Creative Commons Attribution 4.0' /tmp/nova-train-data/LICENSE-DATASET
      - name: Audit and train experimental 10-class YOLO nano (CPU)
        run: |
          python pcb_train_candidate.py \
            --source /tmp/nova-train-data \
            --output artifacts/candidate \
            --epochs "${{ github.event_name == 'workflow_dispatch' && inputs.epochs || 6 }}" \
            --imgsz "${{ github.event_name == 'workflow_dispatch' && inputs.imgsz || 512 }}" \
            --batch 4 --device cpu
      - name: Summarize real training results and limits
        if: always()
        run: |
          if test -f artifacts/candidate/training_report.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          obj=json.load(open("artifacts/candidate/training_report.json"))
          print("### Experimental auxiliary 10-class PCB candidate — NOT deployed")
          print("Source:",obj["source_audit"]["source_repo"],"CC BY 4.0")
          print("Images:",obj["source_audit"]["images"])
          print("Epochs:",obj["parameters"]["epochs"],"Image size:",obj["parameters"]["imgsz"])
          print("Validation metrics (source images, NOT board-independent):")
          for k,v in obj["validation"]["metrics"].items(): print("-",k,":",v)
          print("Production approved:",obj["approved_for_live_use"])
          print("License: Ultralytics AGPL-3.0 obligations need review.")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-experimental-pcb10-candidate
          path: |
            artifacts/candidate/source_audit.json
            artifacts/candidate/training_report.json
            artifacts/candidate/candidate10.pt
            artifacts/candidate/candidate10.onnx
          retention-days: 30
          if-no-files-found: warn
