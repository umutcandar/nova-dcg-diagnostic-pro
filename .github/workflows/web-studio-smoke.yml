name: NOVA web studio smoke tests
on:
  push:
    paths:
      - 'web_studio.py'
      - 'web_onnx_detector.py'
      - 'test_web_onnx_detector.py'
      - 'web_studio.html'
      - 'web_review.js'
      - 'web_component_knowledge.js'
      - 'web_corrections.js'
      - 'test_web_corrections.cjs'
      - 'test_web_component_knowledge.cjs'
      - 'test_web_review.cjs'
      - 'test_web_studio.py'
      - 'test_web_security.py'
      - '.github/workflows/web-studio-smoke.yml'
  pull_request:
    paths:
      - 'web_studio.py'
      - 'web_onnx_detector.py'
      - 'test_web_onnx_detector.py'
      - 'web_studio.html'
      - 'web_review.js'
      - 'web_component_knowledge.js'
      - 'web_corrections.js'
      - 'test_web_corrections.cjs'
      - 'test_web_component_knowledge.cjs'
      - 'test_web_review.cjs'
      - 'test_web_studio.py'
      - 'test_web_security.py'
      - '.github/workflows/web-studio-smoke.yml'
  workflow_dispatch:
jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small test dependency
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3"
      - name: Check Python syntax
        run: python -m py_compile web_studio.py web_onnx_detector.py test_web_studio.py test_web_security.py
      - name: Check inline browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('web_studio.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert len(scripts) == 1, "Expected exactly one inline browser script"
          Path('/tmp/nova-studio.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/nova-studio.js
          node --check web_review.js
          node --check web_component_knowledge.js
          node --check web_corrections.js
      - name: Technician review and reference-rule tests
        run: node --test test_web_review.cjs test_web_component_knowledge.cjs test_web_corrections.cjs
      - name: Verify exported labels with Python training validator
        run: |
          node - <<'JS' > /tmp/nova-annotation.json
          const review = require('./web_review.js');
          console.log(JSON.stringify(review.trainingAnnotation({
            boardId:'kart_001',image:'board.png',width:100,height:100,
            regions:[{label:'Direnç',confirmed:true,bbox_xyxy_pixels:[1,2,20,22]}],
            completedReview:true
          })));
          JS
          python - <<'PY'
          import json
          from dataset import validate_annotation
          with open('/tmp/nova-annotation.json', encoding='utf-8') as handle:
              item = json.load(handle)
          assert len(validate_annotation(item)) == 1
          print('Web labels match NOVA 14-class training schema')
          PY
      - name: HTTP integration tests without model or internet
        run: python -m unittest -v test_web_studio test_web_security test_web_onnx_detector
