name: NOVA web studio smoke tests
on:
  push:
    paths:
      - 'web_studio.py'
      - 'web_studio.html'
      - 'test_web_studio.py'
      - 'test_web_security.py'
      - '.github/workflows/web-studio-smoke.yml'
  pull_request:
    paths:
      - 'web_studio.py'
      - 'web_studio.html'
      - 'test_web_studio.py'
      - 'test_web_security.py'
      - '.github/workflows/web-studio-smoke.yml'
  workflow_dispatch:
jobs:
  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small test dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Check Python syntax
        run: python -m py_compile web_studio.py test_web_studio.py test_web_security.py
      - name: Check inline browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('web_studio.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert len(scripts) == 1, "Expected exactly one inline browser script"
          Path('/tmp/nova-studio.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/nova-studio.js
      - name: HTTP integration tests without model or internet
        run: python -m unittest -v test_web_studio test_web_security
