name: Python quality checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight unit-test dependencies
        run: python -m pip install "Pillow>=10,<13" "reportlab>=4,<5" "tkinterdnd2>=0.4.3,<1"
      # Full torch/Ultralytics installation and trained checkpoint validation
      # run separately in the PCB detector smoke workflow.
      - name: Check Python syntax
        run: python preflight.py
      - name: Run unit tests
        run: python -m unittest discover -p 'test_*.py' -v
