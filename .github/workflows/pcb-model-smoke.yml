name: PCB detector smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'model_inference.py'
      - 'detection_pipeline.py'
      - 'download_and_test_model.py'
      - 'test_*.py'
      - 'measurement_triage.py'
      - 'model_preflight.py'
      - '.github/workflows/pcb-model-smoke.yml'
jobs:
  detector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow ultralytics
      - name: Compile Python source
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -v -p "test_*.py"
      - name: Download verified model
        run: python download_and_test_model.py
      - name: Check checkpoint loading and class compatibility
        run: |
          python - <<'PY'
          from ultralytics import YOLO
          from source_model import SOURCE_CLASSES
          m=YOLO("models/yolov8s_pcb_best.pt")
          names=m.names
          actual=[names[i] for i in range(len(names))] if isinstance(names,dict) else list(names)
          print("Checkpoint classes:",actual)
          if actual!=SOURCE_CLASSES:
              raise SystemExit("Unexpected checkpoint class names")
          from PIL import Image
          from pathlib import Path
          from detection_pipeline import review_image
          Path("test_output").mkdir(exist_ok=True)
          Image.new("RGB",(640,640),(180,180,180)).save("test_output/synthetic_input.png")
          result=review_image("test_output/synthetic_input.png","models/yolov8s_pcb_best.pt","test_output")
          print("Synthetic image inference completed:",result)
          print("This validates execution only, not PCB detection accuracy.")
          PY
