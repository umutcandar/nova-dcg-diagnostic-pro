name: PCB high-resolution tiled-vs-standard A/B experiment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pcb-tiled-ab.yml'
jobs:
  ab-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU ONNX evaluator dependencies
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3" "onnxruntime>=1.19,<2"
      - name: Audit tiled inference tests
        run: python -m unittest -v test_web_onnx_detector test_pcb_external_benchmark
      - name: Retrieve same pinned external CC-BY validation photos
        run: |
          git clone --quiet --filter=blob:none --sparse --depth 1 \
            https://github.com/wangshnegqi/pcb-component-detection-dataset-yolo.git /tmp/nova-ab
          git -C /tmp/nova-ab sparse-checkout set dataset/images/val dataset/labels/val
          test "$(git -C /tmp/nova-ab rev-parse HEAD)" = "0d7ae7310fa607389779b6132285336ad73e96e1"
          grep -q 'Creative Commons Attribution 4.0' /tmp/nova-ab/LICENSE-DATASET
      - name: Compare original and tiled ONNX on identical images
        run: |
          python pcb_external_benchmark.py --dataset /tmp/nova-ab \
            --out artifacts/ab_standard.json --mode fast
          python pcb_external_benchmark.py --dataset /tmp/nova-ab \
            --out artifacts/ab_tiled.json --mode detailed
      - name: Show measured change without auto-shipping
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          a=json.load(open("artifacts/ab_standard.json"))
          b=json.load(open("artifacts/ab_tiled.json"))
          print("### NOVA PCB ONNX A/B — independent exploratory 13-photo subset")
          print("| Metric | 640px standard | tiled detail |")
          print("|---|---:|---:|")
          for key in ("localization_recall","correct_label_recall","top3_correct_label_recall"):
              print(f"| {key} | {a[key]} | {b[key]} |")
          print("**NOT board-disjoint certified; no auto-deployment of detailed mode.**")
          for name in a["classes"]:
              x=a["classes"][name]["correct_class_recall_at_iou_0_5"]
              y=b["classes"][name]["correct_class_recall_at_iou_0_5"]
              print("-",name,":",x,"->",y)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-pcb-onnx-tiled-ab-results
          path: artifacts/ab_*.json
          retention-days: 30
