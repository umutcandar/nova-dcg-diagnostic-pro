name: Evaluate safer 21-class PCB ONNX model
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-pcb-onnx.yml'
jobs:
  model-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only ONNX runtime
        run: python -m pip install "numpy>=1.26,<3" "onnxruntime>=1.19,<2"
      - name: Download, fingerprint and execute public MIT-model ONNX only
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from urllib.request import urlopen, Request
          from shutil import copyfileobj
          import numpy as np
          import onnxruntime as ort
          url="https://huggingface.co/Arshia82sbn/pcb-yolov8s-detection/resolve/main/best.onnx?download=true"
          path=Path("/tmp/nova_21class.onnx")
          req=Request(url,headers={"User-Agent":"NOVA-DCG-model-audit/1.0"})
          with urlopen(req, timeout=120) as response, path.open("wb") as out:
              copyfileobj(response,out)
          size=path.stat().st_size
          assert 10_000_000 < size < 90_000_000, f"Unexpected model size: {size}"
          digest=sha256(path.read_bytes()).hexdigest()
          print("MODEL_BYTES", size)
          print("MODEL_SHA256", digest)
          session=ort.InferenceSession(str(path),providers=["CPUExecutionProvider"])
          print("INPUTS",[(i.name,i.shape,i.type) for i in session.get_inputs()])
          print("OUTPUTS",[(o.name,o.shape,o.type) for o in session.get_outputs()])
          metadata=session.get_modelmeta().custom_metadata_map
          print("METADATA", {k:v[:900] for k,v in metadata.items()})
          inputs=session.get_inputs()
          assert len(inputs)==1
          name=inputs[0].name
          result=session.run(None,{name:np.zeros((1,3,640,640),dtype=np.float32)})
          print("INFERENCE_SHAPES",[r.shape for r in result])
          assert result and result[0].ndim==3
          assert result[0].shape[1]==25 or result[0].shape[-1]==25, "Expected 4 box coordinates + 21 classes"
          print("ONNX 21 CLASS PROBE PASSED: file verified by content fingerprint, no pickle executed")
          PY
