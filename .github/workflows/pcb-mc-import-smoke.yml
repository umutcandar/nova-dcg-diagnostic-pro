name: PCB-MC official-fold importer smoke test
on:
  push:
    paths:
      - 'pcb_mc_import.py'
      - 'pcb_mc_train.py'
      - 'test_pcb_mc_import.py'
      - 'pcb_mc_download_fold.py'
      - 'test_pcb_mc_download_fold.py'
      - '.github/workflows/pcb-mc-import-smoke.yml'
  pull_request:
    paths:
      - 'pcb_mc_import.py'
      - 'pcb_mc_train.py'
      - 'test_pcb_mc_import.py'
      - 'pcb_mc_download_fold.py'
      - 'test_pcb_mc_download_fold.py'
      - '.github/workflows/pcb-mc-import-smoke.yml'
  workflow_dispatch:
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data validation dependencies only
        run: python -m pip install "Pillow>=10,<13" "PyYAML>=6,<7"
      - name: Compile import and training modules
        run: python -m py_compile pcb_mc_import.py pcb_mc_train.py pcb_mc_download_fold.py test_pcb_mc_import.py test_pcb_mc_download_fold.py
      - name: Verify synthetic official-fold conversion and labels
        run: python -m unittest -v test_pcb_mc_import test_pcb_mc_download_fold
