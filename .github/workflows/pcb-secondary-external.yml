name: Verify second vision model on REAL YOLO candidate crops
on:
  workflow_dispatch:
  push:
    paths:
      - 'pcb_secondary_inference.py'
      - 'pcb_secondary_external_compare.py'
      - 'test_pcb_secondary_inference.py'
      - 'test_pcb_secondary_external_compare.py'
      - '.github/workflows/pcb-secondary-external.yml'
jobs:
  external-review-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only inference dependencies
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3" "onnxruntime>=1.19,<2"
      - name: Test second-model SHA256 gate, pixel crops, cautious disagreement logic
        run: |
          python -m unittest -v test_pcb_secondary_inference test_pcb_secondary_external_compare
          python -m py_compile pcb_secondary_inference.py pcb_secondary_external_compare.py
      - name: Retrieve independently trained ONNX by original successful workflow ID
        run: |
          gh run download 44586413233 \
            --repo umutcandar/nova-dcg-diagnostic-pro \
            --name nova-independent-cap-diode-reviewer-research \
            --dir /tmp/nova-second
          python - <<'PY'
          from pathlib import Path
          from pcb_secondary_inference import verify_artifact
          report=Path("/tmp/nova-second/reviewer_training_report.json")
          model=Path("/tmp/nova-second/reviewer_capacitor_diode.onnx")
          item=verify_artifact(report,model,require_release=False)
          assert item["model"]["sha256"]=="0b5dfc6fff65d2944c3c150580978dcdb69b5bec90a4ff7bff4bdabb33409439"
          assert item["approved_for_live_use"] is False
          print("Verified separate trained MobileNetV3 ONNX",model.stat().st_size,"bytes")
          PY
      - name: Fetch pinned independent PCB photographs with real source labels
        run: |
          git clone --quiet --filter=blob:none --sparse --depth 1 \
            https://github.com/wangshnegqi/pcb-component-detection-dataset-yolo.git /tmp/nova-independent-photo
          git -C /tmp/nova-independent-photo sparse-checkout set dataset/images/val dataset/labels/val
          test "$(git -C /tmp/nova-independent-photo rev-parse HEAD)" = "0d7ae7310fa607389779b6132285336ad73e96e1"
          grep -q 'Creative Commons Attribution 4.0' /tmp/nova-independent-photo/LICENSE-DATASET
      - name: Run actual 21-class tiled YOLO then second model on SAME bounding box pixels
        run: |
          python pcb_secondary_external_compare.py \
            --dataset /tmp/nova-independent-photo \
            --report /tmp/nova-second/reviewer_training_report.json \
            --model /tmp/nova-second/reviewer_capacitor_diode.onnx \
            --out artifacts/independent_yolo_crop_review.json
      - name: Publish honest real photo error counts without automatic label changes
        if: always()
        run: |
          if test -f artifacts/independent_yolo_crop_review.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("artifacts/independent_yolo_crop_review.json"))
          print("### True two-model PCB study on 13 public photos")
          for k,v in d["counts"].items():print("-",k,":",v)
          print("Auto-corrected component classes:",d["auto_corrected_labels"])
          print("Approved for live:",d["approved_for_live_use"])
          print("**Only TWO external diode ground truths; no general diode accuracy claim.**")
          print("**Binary second model is not an object detector; false positives require background class.**")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-two-vision-model-real-yolo-box-comparison
          path: artifacts/independent_yolo_crop_review.json
          if-no-files-found: warn
          retention-days: 30
