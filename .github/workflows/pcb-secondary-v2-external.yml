name: External real-photo audit of 3-class second PCB vision AI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pcb-secondary-v2-external.yml'
jobs:
  independent-three-way-vision-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimum trusted ONNX CPU runtime, no .pt loader
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3" "onnxruntime>=1.19,<2"
      - name: Test third abstention class and no automatic relabeling
        run: python -m unittest -v test_pcb_secondary_inference_v2 test_pcb_secondary_external_compare
      - name: Get SHA256-pinned trained v2 model from successful original GitHub run
        run: |
          gh run download 44589148579 \
            --repo umutcandar/nova-dcg-diagnostic-pro \
            --name nova-secondary-v2-cap-diode-other-research \
            --dir /tmp/nova-second-v2
          python - <<'PY'
          from pathlib import Path
          from pcb_secondary_inference_v2 import verify_model
          root=Path("/tmp/nova-second-v2")
          report=verify_model(root/"reviewer_v2_training_report.json",
                              root/"reviewer_cap_diode_other.onnx")
          assert report["model"]["sha256"]=="5d93c46f30af29d29f45db0b3a0b488a2a7fad9408331a19e05d0e24ac762415"
          assert report["approved_for_live_use"] is False
          print("Verified 3-family independent ONNX",report["model"]["bytes"],"bytes")
          PY
      - name: Fetch never-seen 13-image external PCB-Cap/Diode label set
        run: |
          git clone --quiet --filter=blob:none --sparse --depth 1 \
            https://github.com/wangshnegqi/pcb-component-detection-dataset-yolo.git /tmp/nova-independent-test
          git -C /tmp/nova-independent-test sparse-checkout set dataset/images/val dataset/labels/val
          test "$(git -C /tmp/nova-independent-test rev-parse HEAD)" = "0d7ae7310fa607389779b6132285336ad73e96e1"
          grep -q 'Creative Commons Attribution 4.0' /tmp/nova-independent-test/LICENSE-DATASET
      - name: Run REAL tiled 21-class YOLO then 3-way crop reviewer on same boxes
        run: |
          python pcb_secondary_external_compare.py \
            --dataset /tmp/nova-independent-test \
            --report /tmp/nova-second-v2/reviewer_v2_training_report.json \
            --model /tmp/nova-second-v2/reviewer_cap_diode_other.onnx \
            --version v2 \
            --out artifacts/second_model_v2_external_audit.json
      - name: Compare helpful vs harmful review alerts honestly
        if: always()
        run: |
          if test -f artifacts/second_model_v2_external_audit.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data=json.load(open("artifacts/second_model_v2_external_audit.json"))
          print("### Real two-AI + OTHER validation on new labelled PCB photos")
          for k,value in data["counts"].items():
              print("-",k,":",value)
          print("Auto-relabelled components:",data["auto_corrected_labels"])
          print("Released:",data["approved_for_live_use"])
          print("Only two external diode GT boxes — more real boards required.")
          print("Other component class is NOT generic no-component/background.")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-three-class-real-yolo-crop-evaluation
          path: artifacts/second_model_v2_external_audit.json
          if-no-files-found: warn
          retention-days: 30
